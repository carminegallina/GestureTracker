name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # I pacchetti winrt-* esistono solo per Windows: su Linux l'installazione
    # delle dipendenze fallirebbe.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            hand_gesture_controller/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q
